service: bathtub-robot-services
useDotenv: true

plugins:
  - serverless-localstack

custom:
  localstack:
    stages:
      - local
    host: http://localhost:4566
    autostart: false

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:BatchGetItem
            - dynamodb:BatchWriteItem
            - dynamodb:GetItem
            - dynamodb:PutItem
          Resource:
            - !GetAtt StateTable.Arn
        - Effect: Allow
          Action:
            - sns:Publish
          Resource:
            - !Ref NewPostTopic
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:PutObjectAcl
          Resource:
            - !Sub arn:aws:s3:::${env:OUTPUT_BUCKET_NAME, 'blogroll-aggregator-bucket'}/*
            - !Sub arn:aws:s3:::${env:OUTPUT_BUCKET_NAME, 'blogroll-aggregator-bucket'}

functions:
  poller:
    handler: services/poller/index.handler
    events:
      - schedule:
          rate: rate(15 minutes)
          enabled: ${env:POLLER_ENABLED, 'true'}
    environment:
      JSON_FEED_URL: ${env:JSON_FEED_URL}
      STATE_TABLE_NAME: !Ref StateTable
      NOTIFY_TOPIC_ARN: !Ref NewPostTopic

  fediverse-notifier:
    handler: services/fediverse-notifier/index.handler
    events:
      - sns:
          arn: !Ref NewPostTopic
          topicName: ${self:service}-${opt:stage, 'dev'}-new-posts
    environment:
      FEDIVERSE_INSTANCE_URL: ${env:FEDIVERSE_INSTANCE_URL}
      FEDIVERSE_ACCESS_TOKEN: ${env:FEDIVERSE_ACCESS_TOKEN}

  blogroll-aggregator:
    handler: services/blogroll-aggregator/handler.handler
    runtime: python3.11
    timeout: 60
    environment:
      OPML_URL: ${env:OPML_URL, 'https://www.inoreader.com/reader/subscriptions/export/user/1006091082/label/Blaugust%202026'}
      OUTPUT_BUCKET_NAME: ${env:OUTPUT_BUCKET_NAME, 'blogroll-aggregator-bucket'}
      OUTPUT_FILE_KEY: ${env:OUTPUT_FILE_KEY, 'blogroll.json'}
      USER_AGENT: ${env:USER_AGENT, 'BathtubRobot/1.0 (OPML Blogroll Aggregator; +https://github.com/tkrehbiel/bathtub-robot-services)'}
    events:
      - schedule:
          rate: rate(30 minutes)
          enabled: ${env:POLLER_ENABLED, 'true'}

resources:
  Resources:
    StateTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${opt:stage, 'dev'}-poll-history
        AttributeDefinitions:
          - AttributeName: url
            AttributeType: S
        KeySchema:
          - AttributeName: url
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    NewPostTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: ${self:service}-${opt:stage, 'dev'}-new-posts

    EmailSubscription:
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn: !Ref NewPostTopic
        Endpoint: ${env:NOTIFICATION_EMAIL}
        Protocol: email

    BlogrollBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${env:OUTPUT_BUCKET_NAME, 'blogroll-aggregator-bucket'}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          BlockPublicPolicy: false
          IgnorePublicAcls: false
          RestrictPublicBuckets: false
        CorsConfiguration:
          CorsRules:
            - AllowedHeaders:
                - '*'
              AllowedOrigins:
                - '*'
              AllowedMethods:
                - GET
              MaxAge: 3000

    BlogrollBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref BlogrollBucket
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Sid: PublicReadGetObject
              Effect: Allow
              Principal: '*'
              Action:
                - s3:GetObject
              Resource: !Sub arn:aws:s3:::${BlogrollBucket}/*
